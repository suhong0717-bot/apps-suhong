<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: #0a0c0f;

  overflow-x: hidden;

/* ── 뒤로가기 버튼 ── */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 200;
  background: rgba(14,19,25,0.9);
  border: 1px solid #1e2530;
  color: #5a6a7a;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 6px 12px;
  border-radius: 20px;
  text-decoration: none;
  backdrop-filter: blur(6px);
  transition: color 0.2s, border-color 0.2s;
}
.back-btn:hover { color: #c8d6e5; border-color: #58b4ff; }

/* ── 버전 뱃지 ── */
.version-badge {
  display: inline-flex;
  align-items: center;
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 200;
  background: rgba(14,19,25,0.9);
  border: 1px solid #1e2530;
  color: #5a6a7a;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 5px 10px;
  border-radius: 20px;
  backdrop-filter: blur(6px);
}

.st-wrap {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 60px 20px 28px;
}
.st-wrap::before {
  content: '';
  position: fixed;
  inset: 0;

  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.st-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid #1e2530;
  position: relative; z-index: 1;
}
.st-header-left h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px; font-weight: 700;
  color: #58b4ff; letter-spacing: -0.5px;
}

.trade-panel {
  background: #0f1215;
  border: 1px solid #1e2530;
  border-radius: 8px;
  padding: 18px 20px;
  margin-bottom: 24px;
  position: relative; z-index: 1;
}
.trade-panel h3 {
  width: 100%; font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: #5a6a7a; text-transform: uppercase;
  letter-spacing: 1.5px; margin-bottom: 4px;
}
.field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 140px; }
.field label { font-size: 11px; color: #5a6a7a; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.5px; }
.field select, .field input {
  background: #141820; border: 1px solid #1e2530;
  color: #c8d6e5; font-family: 'JetBrains Mono', monospace;
  font-size: 14px; padding: 8px 12px;
  border-radius: 4px; outline: none;
  transition: border-color 0.2s; width: 100%;
}
.field select:focus, .field input:focus { border-color: #58b4ff; }
.field select option { background: #141820; }

.btn-buy {
  background: rgba(88,180,255,0.12); border: 1px solid #2a5a8a;
  color: #58b4ff; font-family: 'JetBrains Mono', monospace;
  font-size: 13px; font-weight: 700; padding: 8px 22px;
  border-radius: 4px; cursor: pointer; letter-spacing: 1px;

.btn-buy:hover { background: rgba(88,180,255,0.22); }
.btn-add-stock {

  color: #5a6a7a; font-family: 'JetBrains Mono', monospace;
  font-size: 12px; padding: 8px 16px; border-radius: 4px;
  cursor: pointer; transition: all 0.15s; height: 38px;
}
.btn-add-stock:hover { border-color: #58b4ff; color: #58b4ff; }

.table-wrap {
  background: #0f1215; border: 1px solid #1e2530;
  border-radius: 8px; overflow: hidden; margin-bottom: 24px;
  position: relative; z-index: 1;
}
table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
thead tr { background: #141820; border-bottom: 1px solid #1e2530; }
th { padding: 10px 8px; text-align: right; font-size: 9px; font-weight: 500; color: #5a6a7a; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
th:first-child { text-align: left; }
tbody tr { border-bottom: 1px solid rgba(30,37,48,0.7); transition: background 0.12s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(88,180,255,0.03); }
td { padding: 9px 8px; text-align: right; color: #c8d6e5; white-space: nowrap; }
td:first-child { text-align: left; }

let sxA = [], sxB = [];

let sxRangeStart = 0, sxRangeEnd = null;
let sxPriceMode = 'close';
let sxCurrentPrice = null;
let sxChartBalance = null, sxChartPnl = null;

function sxParseTxDelta(tx) {
  if (!tx) return 0;
  const m = tx.match(/^([+-]\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}
function sxPostBalance(row) {
  if (!row) return 0;
  return row.balance + sxParseTxDelta(row.tx);
}
function sxLastState(data) {
  if (!data || data.length === 0) return { balance: 0, avg: null, cum: 0 };
  const last = data[data.length - 1];
  const balance = sxPostBalance(last);
  let avg = null;
  for (let i = data.length - 1; i >= 0; i--) {
    const row = data[i];
    const postBal = sxPostBalance(row);
    if (row.avg !== null && row.avg !== undefined) { avg = row.avg; break; }
    if (postBal === 0) { avg = null; break; }
  }
  const lastCum = (last.cum !== null && last.cum !== undefined) ? last.cum : 0;
  return { balance, avg, cum: lastCum };
}

function sxHypoAt(data, price) {
  const state = sxLastState(data);
  if (price === null || price === undefined || isNaN(price) || state.avg === null || !state.balance) {
    return state.cum;

const sxChartInfo = {};

function sxDrawChart(canvasId, legendId, labels, series, opts) {
  const canvas = document.getElementById(canvasId);
  const wrap = canvas.parentElement;
  const cssWidth = wrap.clientWidth - 32;
  const cssHeight = 220;
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = cssWidth + 'px';
  canvas.style.height = cssHeight + 'px';
  canvas.width = Math.max(1, Math.floor(cssWidth * dpr));
  canvas.height = Math.max(1, Math.floor(cssHeight * dpr));
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const hasRight = series.some(s => s.axis === 'right');
  const padL = 44, padR = hasRight ? 44 : 14, padT = 10, padB = 20;
  const plotW = Math.max(10, cssWidth - padL - padR);
  const plotH = Math.max(10, cssHeight - padT - padB);

  const leftVals = series.filter(s => s.axis !== 'right').flatMap(s => s.data);
  const rightVals = series.filter(s => s.axis === 'right').flatMap(s => s.data);
  let [lMin, lMax] = sxRange(leftVals);
  if (opts && opts.leftMin !== undefined && opts.leftMin !== null) lMin = opts.leftMin;
  const [rMin, rMax] = hasRight ? sxRange(rightVals) : [0, 1];

  function xPos(i) { return padL + (labels.length <= 1 ? plotW / 2 : (plotW * i / (labels.length - 1))); }
  function yPosLeft(v) { return padT + plotH - ((v - lMin) / (lMax - lMin)) * plotH; }
  function yPosRight(v) { return padT + plotH - ((v - rMin) / (rMax - rMin)) * plotH; }

  const legendEl = document.getElementById(legendId);
  if (legendEl) {
    legendEl.innerHTML = series.map(s => `
      <span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:10.5px;color:#c8d6e5;font-family:'JetBrains Mono',monospace;">
        <span style="width:10px;height:2px;background:${s.color};display:inline-block;${s.dashed ? 'border-top:2px dashed ' + s.color + ';height:0;' : ''}"></span>
        ${s.label}
      </span>
    `).join('');
  }

  sxChartInfo[canvasId] = { ctx, cssWidth, cssHeight, padL, padT, plotW, plotH, lMin, lMax, rMin, rMax, hasRight, xPos, yPosLeft, yPosRight, labels, series, activeIdx: null, opts: opts || {} };

  sxRedraw(canvasId);

  if (!canvas.dataset.sxBound) {
    canvas.dataset.sxBound = '1';
    canvas.parentElement.style.position = 'relative';
    canvas.style.touchAction = 'none';
    const move = (clientX) => {
      const info = sxChartInfo[canvasId];
      if (!info) return;
      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      if (x < info.padL || x > info.padL + info.plotW) { sxSyncActive(null); return; }
      let idx = 0, minDist = Infinity;
      for (let i = 0; i < info.labels.length; i++) {
        const px = info.xPos(i);
        const d = Math.abs(px - x);
        if (d < minDist) { minDist = d; idx = i; }
      }
      sxSyncActive(idx);
    };
    canvas.addEventListener('mousedown', (e) => move(e.clientX));
    canvas.addEventListener('mousemove', (e) => { if (e.buttons === 1) move(e.clientX); });
    canvas.addEventListener('touchstart', (e) => { if (e.touches.length === 1) move(e.touches[0].clientX); }, { passive: true });
    canvas.addEventListener('touchmove', (e) => { if (e.touches.length === 1) move(e.touches[0].clientX); }, { passive: true });
    canvas.addEventListener('mouseleave', () => sxSyncActive(null));
    canvas.addEventListener('touchend', () => { clearTimeout(canvas._sxLeaveTimer); canvas._sxLeaveTimer = setTimeout(() => sxSyncActive(null), 3000); });

}

const SX_LINKED_CHARTS = ['sx-chart-balance', 'sx-chart-pnl', 'sx-chart-diff'];

function sxRedraw(canvasId) {

  const { ctx, cssWidth, cssHeight, padL, padT, plotW, plotH, lMin, lMax, rMin, rMax, hasRight, xPos, yPosLeft, yPosRight, labels, series, activeIdx, opts } = info;

  if (hasRight) {
    ctx.textAlign = 'left';
    for (let i = 0; i <= 4; i++) {
      const v = rMax - (rMax - rMin) * i / 4;

}

    if (!info) return false;
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left, y = clientY - rect.top;
    return x >= info.padL && x <= info.padL + info.plotW && y >= info.padT && y <= info.padT + info.plotH;
  }
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      if (!inPlotArea(e.touches[0].clientX, e.touches[0].clientY) || !inPlotArea(e.touches[1].clientX, e.touches[1].clientY)) { pinch = null; return; }
      pinch = { startDist: dist(e.touches[0], e.touches[1]), startMid: midX(e.touches[0], e.touches[1]), startRange: [sxRangeStart, sxRangeEnd] };
      sxSyncActive(null);
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinch) {
      const n = (sxFullRows.length - 1) || 1;
      const curDist = dist(e.touches[0], e.touches[1]);
      const scale = pinch.startDist > 10 ? (pinch.startDist / Math.max(curDist, 10)) : 1;
      const [s0, e0] = pinch.startRange;
      const center = (s0 + e0) / 2;
      let halfRange = ((e0 - s0) / 2) * scale;
      halfRange = Math.max(1, Math.min(n / 2, halfRange));
      const curMid = midX(e.touches[0], e.touches[1]);
      const dx = curMid - pinch.startMid;
      const rect = canvas.getBoundingClientRect();
      const shiftIdx = Math.round((dx / Math.max(rect.width, 1)) * n);
      const newCenter = center - shiftIdx;
      let newStart = Math.round(newCenter - halfRange);
      let newEnd = Math.round(newCenter + halfRange);
      if (newEnd - newStart < 1) newEnd = newStart + 1;
      if (newStart < 0) { newEnd -= newStart; newStart = 0; }
      if (newEnd > n) { newStart -= (newEnd - n); newEnd = n; }
      newStart = Math.max(0, newStart);
      newEnd = Math.min(n, newEnd);
      sxRangeStart = newStart;
      sxRangeEnd = newEnd;
      scheduleRerender();
    }
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => { if (e.touches.length < 2) pinch = null; });
}

function sxBindRangeDrag() {
  SX_LINKED_CHARTS.forEach(id => {
    const c = document.getElementById(id);
    if (c) sxAttachPinchPan(c);
  });
}

function sxRenderTable(data, tbodyId, chartRows, which) {
  const totalsMap = {};
  chartRows.forEach(r => { totalsMap[r.date] = which === 'a' ? r.aTotal : r.bTotal; });
  const tbody = document.getElementById(tbodyId);
  if (!data.length) { tbody.innerHTML = `<tr class="empty-row"><td colspan="9">아직 데이터가 없어요.</td></tr>`; return; }
  tbody.innerHTML = data.map(row => {
    const txColor = row.tx.startsWith('+') ? '#00e676' : (row.tx.startsWith('-') && row.tx !== '-') ? '#ff5252' : '#5a6a7a';
    return `<tr>
      <td>${row.date}</td>
      <td>${row.balance}</td>
      <td style="color:${txColor}">${row.tx}</td>
      <td>${(row.close !== null && row.close !== undefined) ? sxFmtPlain(row.close) : '-'}</td>
      <td>${(row.trade !== null && row.trade !== undefined) ? sxFmtPlain(row.trade) : '-'}</td>
      <td>${(row.avg !== null && row.avg !== undefined) ? sxFmtPlain(row.avg) : '-'}</td>
      <td style="color:${sxColor(row.pnl)}">${sxFmt(row.pnl)}</td>
      <td style="color:${sxColor(row.cum)}">${sxFmt(row.cum)}</td>
      <td style="color:${sxColor(totalsMap[row.date])}">${sxFmt(totalsMap[row.date])}</td>
    </tr>`;
  }).join('');
}

function sxToggleForm() {
  const body = document.getElementById('sx-form-body');
  const chevron = document.getElementById('sx-form-chevron');
  const isOpen = body.style.display === 'block';
  body.style.display = isOpen ? 'none' : 'block';
  chevron.textContent = isOpen ? '▾' : '▴';
}

function sxAddEntry() {
  const errEl = document.getElementById('sx-form-error');
  const okEl = document.getElementById('sx-form-success');
  errEl.textContent = ''; okEl.textContent = '';
  const date = document.getElementById('sx-date').value.trim();
  const close = document.getElementById('sx-close').value.trim();
  const aType = document.getElementById('sx-a-type').value;
  const aQty = document.getElementById('sx-a-qty').value.trim();
  const bType = document.getElementById('sx-b-type').value;
  const bQty = document.getElementById('sx-b-qty').value.trim();
  const bTrade = document.getElementById('sx-b-trade').value.trim();
  if (!/^\d{2}\.\d{2}$/.test(date)) { errEl.textContent = '날짜는 MM.DD 형식으로 입력해주세요 (예: 07.23)'; return; }
  if (!close || isNaN(Number(close))) { errEl.textContent = '종가를 숫자로 입력해주세요'; return; }
  if (aType !== 'none' && (!aQty || isNaN(Number(aQty)) || Number(aQty) <= 0)) { errEl.textContent = 'A계좌 수량을 양수로 입력해주세요'; return; }
  if (bType !== 'none' && (!bQty || isNaN(Number(bQty)) || Number(bQty) <= 0)) { errEl.textContent = 'B계좌 수량을 양수로 입력해주세요'; return; }
  if (bTrade && isNaN(Number(bTrade))) { errEl.textContent = 'B계좌 거래가를 숫자로 입력해주세요'; return; }
  try {
    const aRow = sxComputeNewRow({ data: sxA, date, type: aType, qty: aQty, close, trade: close });
    const bRow = sxComputeNewRow({ data: sxB, date, type: bType, qty: bQty, close, trade: bTrade || close });
    sxA = [...sxA, aRow];
    sxB = [...sxB, bRow];
    sxSave();
    renderSoxl();
    okEl.textContent = `✅ ${date} 데이터가 추가됐어요.`;
    document.getElementById('sx-date').value = '';
    document.getElementById('sx-close').value = '';
    document.getElementById('sx-a-type').value = 'none';
    document.getElementById('sx-a-qty').value = '';
    document.getElementById('sx-b-type').value = 'none';
    document.getElementById('sx-b-qty').value = '';
    document.getElementById('sx-b-trade').value = '';
  } catch (e) {
    errEl.textContent = '오류: ' + (e && e.message ? e.message : String(e));
  }
}

function sxDeleteLast() {
  if (!sxA.length && !sxB.length) return;
  const removedDate = sxA.length ? sxA[sxA.length - 1].date : (sxB.length ? sxB[sxB.length - 1].date : '');
  sxA = sxA.slice(0, -1);
  sxB = sxB.slice(0, -1);
  sxSave();
  renderSoxl();
  document.getElementById('sx-delete-msg').textContent = `🗑️ ${removedDate || '마지막'} 거래를 A/B 계좌에서 삭제했어요.`;
}

sxLoad();
renderSoxl();

window.addEventListener('resize', () => { renderSoxl(); });
</script>
