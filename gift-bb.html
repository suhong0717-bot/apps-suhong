<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>유찬이 증여 플랜</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root {
  --bg:#0f1318; --bg2:#141720; --bg3:#1a1f2e; --border:#252a38;
  --fg:#e8eaf0; --fg2:#a0a8b8; --fg3:#556070;
  --accent:#ff6b00; --green:#00c851; --red:#ff3d3d; --blue:#58a6ff; --amber:#d4a853; --mint:#3dd6b0;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:'IBM Plex Sans KR',sans-serif;font-size:13px;color:var(--fg);min-height:100vh;padding:47px 0 96px}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* ── Topbar ── */
.bb-topbar{position:fixed;top:0;left:0;right:0;height:44px;background:var(--bg2);border-bottom:3px solid var(--accent);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:9999}
.bb-home-btn{display:inline-flex;align-items:center;background:rgba(255,107,0,.08);border:1px solid rgba(255,107,0,.3);color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:4px 12px;border-radius:20px;letter-spacing:.04em;text-decoration:none}
.topbar-title{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.12em;white-space:nowrap;position:absolute;left:50%;transform:translateX(-50%)}
.bb-ver-btn{background:var(--bg3);border:1px solid rgba(255,107,0,.3);color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;cursor:pointer}
.bb-popup{display:none;position:absolute;right:0;top:38px;background:var(--bg2);border:1px solid var(--border);border-top:2px solid var(--accent);width:240px;z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.bb-popup-title{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--accent);letter-spacing:.08em;padding:8px 12px 6px;border-bottom:1px solid var(--border)}

.wrap{padding:12px 12px 0;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.card{background:var(--bg2);border:1px solid var(--border)}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:var(--accent);border:1px solid rgba(255,107,0,.4);background:rgba(255,107,0,.08);padding:2px 7px;letter-spacing:.08em}
.hd b{font-size:13px;font-weight:600}
.hd .r{margin-left:auto;font-size:10px;color:var(--fg3);font-family:'IBM Plex Mono',monospace}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);letter-spacing:.06em}

/* ── Hero ── */
.hero{padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.kid{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--mint),var(--blue));display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.kid b{font-size:16px;font-weight:600}
.kid small{display:block;color:var(--fg3);font-size:11px;font-family:'IBM Plex Mono',monospace;margin-top:2px}
.big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.big b{font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:700;line-height:1.1}
.big span{color:var(--fg2);font-size:12px}
.gauge{height:14px;background:var(--bg3);position:relative;overflow:hidden;border:1px solid var(--border)}
.gauge i{position:absolute;top:0;bottom:0}
.gl{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--fg3);gap:8px}
.over{color:var(--red);font-size:12px;border-left:3px solid var(--red);background:rgba(255,61,61,.08);padding:7px 10px}

.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats div{padding:10px 12px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:3px;min-width:0}
.stats div:last-child{border-right:0}
.stats b{font-family:'IBM Plex Mono',monospace;font-size:15px;white-space:nowrap}

.buckets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px}
.bk{border:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:4px;background:var(--bg);min-width:0}
.bk.cur{border-color:var(--mint);box-shadow:inset 0 2px 0 var(--mint)}
.bk b{font-family:'IBM Plex Mono',monospace;font-size:13px}
.bk .mini{height:4px;background:var(--bg3);display:flex;overflow:hidden}
.bk .mini i{display:block;height:100%}
.note{padding:0 12px 12px;font-size:11px;color:var(--fg3);line-height:1.6}

/* ── Log ── */
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.row:last-child{border-bottom:0}
.row .d{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--fg2);width:66px;flex:none;line-height:1.35}
.row .d small{display:block;color:var(--fg3);font-size:9px}
.row .m{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.row .m span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;flex:none}
.row.plan .d,.row.plan .t,.row.plan .a{opacity:.6}
.pills{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pill{font-size:10px;padding:1px 6px;border:1px solid var(--border);color:var(--fg2);background:none;font-family:'IBM Plex Sans KR',sans-serif;cursor:pointer}
.pill.plan{color:var(--fg3);border-style:dashed;cursor:default}
.pill.need{color:var(--accent);border-color:rgba(255,107,0,.5)}
.pill.ok{color:var(--green);border-color:rgba(0,200,81,.4)}
.pill.kind{cursor:default;color:var(--fg3)}
.dd{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--accent)}
.empty{padding:30px 16px;text-align:center;color:var(--fg3);font-size:12px;line-height:1.8}

/* ── FAB + sheet ── */
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#111;border:0;font-family:'IBM Plex Sans KR',sans-serif;font-weight:600;font-size:14px;padding:12px 18px;border-radius:24px;box-shadow:0 6px 18px rgba(0,0,0,.5);cursor:pointer;z-index:100}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:3px solid var(--accent);z-index:201;max-height:92vh;overflow:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--accent);display:flex;justify-content:space-between}
.sheet h3 button{background:none;border:0;color:var(--fg3);font-size:18px;cursor:pointer;line-height:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:10px;color:var(--fg3);font-family:'IBM Plex Mono',monospace;letter-spacing:.06em}
.fld input{background:var(--bg);border:1px solid var(--border);color:var(--fg);font-family:'IBM Plex Sans KR',sans-serif;font-size:14px;padding:9px 10px;width:100%;min-width:0;border-radius:0}
.fld input:focus{outline:none;border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{background:var(--bg);border:1px solid var(--border);color:var(--fg2);font-size:12px;padding:6px 10px;cursor:pointer;font-family:'IBM Plex Sans KR',sans-serif}
.opts button.on{border-color:var(--accent);color:var(--accent);background:rgba(255,107,0,.08)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{background:var(--bg);border:1px solid var(--border);color:var(--fg3);font-size:13px;padding:8px 0;cursor:pointer;font-family:'IBM Plex Sans KR',sans-serif}
.seg button.on{color:var(--fg);border-color:var(--mint);background:rgba(61,214,176,.08)}
.hint{font-size:11px;color:var(--fg3);line-height:1.5}
.btns{display:flex;gap:8px}
.btn{flex:1;border:1px solid var(--border);background:var(--bg3);color:var(--fg);font-size:14px;padding:11px;cursor:pointer;font-family:'IBM Plex Sans KR',sans-serif}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#111;font-weight:600}
.btn.del{flex:none;color:var(--red);border-color:rgba(255,61,61,.4);background:none;padding:11px 14px}
.err{color:var(--red);font-size:11px;min-height:14px}
</style>
</head>
<body>

<div class="bb-topbar">
  <a href="index.html" class="bb-home-btn">← AI Tool 모음</a>
  <span class="topbar-title">유찬이 증여 플랜</span>
  <div style="position:relative;">
    <button class="bb-ver-btn" onclick="toggleVersionPopup(event)">v</button>
    <div id="versionPopup" class="bb-popup"><div class="bb-popup-title">업데이트 내역</div></div>
  </div>
</div>

<div class="wrap">
  <div class="card hero">
    <div class="kid"><div class="av">👶</div><div><b>유찬</b><small id="kidSub"></small></div></div>
    <div><div class="lbl" id="heroLbl">이번 구간 비과세 한도 사용</div>
      <div class="big" id="heroBig"></div></div>
    <div class="gauge" id="gauge"></div>
    <div class="gl" id="gaugeLbl"></div>
    <div class="over" id="overMsg" hidden></div>
  </div>

  <div class="card"><div class="stats">
    <div><span class="lbl">남은 한도</span><b id="stLeft" style="color:var(--mint)"></b></div>
    <div><span class="lbl">다음 구간</span><b id="stNext"></b></div>
    <div><span class="lbl">신고 필요</span><b id="stNeed"></b></div>
  </div></div>

  <div class="card">
    <div class="hd"><span class="tag">10Y</span><b>구간별 한도</b><span class="r">부모·조부모 합산</span></div>
    <div class="buckets" id="buckets"></div>
    <div class="note">미성년(만 19세 미만)은 10년 동안 2,000만원, 성년은 5,000만원까지 증여세가 없어요. 부모·조부모가 준 돈을 모두 합쳐요. 한도 안이라도 신고해 두면 나중에 자금 출처를 증명하기 좋아요.</div>
  </div>

  <div class="card">
    <div class="hd"><span class="tag">LOG</span><b>증여 기록 · 계획</b><span class="r" id="logCnt"></span></div>
    <div id="list"></div>
  </div>
</div>

<button class="fab" onclick="openSheet()">＋ 추가</button>

<div class="dim" id="dim" hidden onclick="closeSheet()"></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <h3><span id="sheetTitle">새 증여</span><button onclick="closeSheet()">×</button></h3>
    <div class="fld"><label>상태</label>
      <div class="seg" id="fSt"><button type="button" data-v="done">실행 (줬어요)</button><button type="button" data-v="plan">계획</button></div>
    </div>
    <div class="row2">
      <div class="fld"><label>날짜</label><input type="date" id="fDate"></div>
      <div class="fld"><label>금액 (만원)</label><input type="tel" inputmode="numeric" id="fAmt" placeholder="예: 500"></div>
    </div>
    <div class="fld"><label>준 사람</label><div class="opts" id="fGiver"></div></div>
    <div class="fld"><label>형태</label><div class="opts" id="fKind"></div></div>
    <div class="fld"><label>메모 (선택)</label><input type="text" id="fMemo" placeholder="예: 돌 기념, TIGER S&amp;P500 10주"></div>
    <div class="fld" id="fRepWrap"><label>증여세 신고</label>
      <div class="seg" id="fRep"><button type="button" data-v="need">아직</button><button type="button" data-v="done">완료</button></div>
      <span class="hint" id="fRepHint"></span>
    </div>
    <div class="err" id="fErr"></div>
    <div class="btns">
      <button class="btn del" id="fDel" hidden>삭제</button>
      <button class="btn" onclick="closeSheet()">취소</button>
      <button class="btn pri" id="fSave">저장</button>
    </div>
  </div>
</div>

<script>
var KEY = 'gift-plan-v1';
var BIRTH = '2026-09-02';
var GIVERS = ['아빠', '엄마', '친할아버지', '친할머니', '외할아버지', '외할머니', '기타'];
var KINDS = ['현금', '주식', '기타'];
var MAN = 10000;

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
var data = load();

function today() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function addYears(iso, n) { var y = Number(iso.slice(0, 4)) + n; return y + iso.slice(4); }
function ageAt(iso) { // 만 나이
  var a = Number(iso.slice(0, 4)) - Number(BIRTH.slice(0, 4));
  if (iso.slice(5) < BIRTH.slice(5)) a--;
  return a;
}
function man(n) { // 원 → "1,234만" / "1억 2,000만"
  var m = Math.round(n / MAN);
  if (!m) return '0';
  if (m >= 10000) { var e = Math.floor(m / 10000), r = m % 10000; return e + '억' + (r ? ' ' + r.toLocaleString('ko-KR') + '만' : ''); }
  return m.toLocaleString('ko-KR') + '만';
}
function dot(iso) { return iso.replace(/-/g, '.'); }

/* 구간: 0~9세 2천, 10~18세 2천(미성년), 19~28세 5천, 29~38세 5천 */
var BUCKETS = [
  { from: 0, to: 10, lim: 2000 * MAN, name: '0~9세' },
  { from: 10, to: 19, lim: 2000 * MAN, name: '10~18세' },
  { from: 19, to: 29, lim: 5000 * MAN, name: '19~28세' },
  { from: 29, to: 39, lim: 5000 * MAN, name: '29~38세' }
];
BUCKETS.forEach(function (b) { b.start = addYears(BIRTH, b.from); b.end = addYears(BIRTH, b.to); });
function bucketOf(iso) { for (var i = 0; i < BUCKETS.length; i++) if (iso >= BUCKETS[i].start && iso < BUCKETS[i].end) return i; return -1; }
function sums(i) {
  var b = BUCKETS[i], s = { done: 0, plan: 0 };
  data.forEach(function (r) { if (r.date >= b.start && r.date < b.end) s[r.st] += r.amt; });
  return s;
}
/* 신고 기한: 증여한 달의 말일부터 3개월 */
function deadline(iso) {
  var y = Number(iso.slice(0, 4)), m = Number(iso.slice(5, 7)) + 3;
  if (m > 12) { y++; m -= 12; }
  var last = new Date(y, m, 0).getDate();
  return y + '-' + String(m).padStart(2, '0') + '-' + String(last).padStart(2, '0');
}
function dday(iso) { return Math.round((new Date(iso + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 864e5); }

function render() {
  var t = today(), age = Math.max(0, ageAt(t));
  var ci = bucketOf(t); if (ci < 0) ci = 0;
  var cb = BUCKETS[ci], cs = sums(ci);
  document.getElementById('kidSub').textContent = dot(BIRTH) + ' 생 · 만 ' + age + '세 · ' + cb.name + ' 구간';

  var used = cs.done, tot = cs.done + cs.plan;
  document.getElementById('heroLbl').textContent = '이번 구간(' + cb.name + ') 비과세 한도 사용';
  document.getElementById('heroBig').innerHTML = '<b>' + man(used) + '</b><span>/ ' + man(cb.lim) + '원</span>';
  var pd = Math.min(used / cb.lim, 1) * 100, pp = Math.min(tot / cb.lim, 1) * 100 - pd;
  var over = tot > cb.lim;
  document.getElementById('gauge').innerHTML =
    '<i style="left:0;width:' + pd + '%;background:' + (used > cb.lim ? 'var(--red)' : 'var(--mint)') + '"></i>' +
    '<i style="left:' + pd + '%;width:' + pp + '%;background:repeating-linear-gradient(45deg,' + (over ? 'rgba(255,61,61,.45)' : 'rgba(61,214,176,.4)') + ' 0 4px,transparent 4px 8px)"></i>';
  document.getElementById('gaugeLbl').innerHTML = '<span>0</span><span>실행 ' + Math.round(used / cb.lim * 100) + '% · 계획 ' + Math.round(cs.plan / cb.lim * 100) + '%</span><span>' + man(cb.lim) + '</span>';
  var om = document.getElementById('overMsg');
  om.hidden = !over;
  if (over) om.textContent = '계획까지 합치면 한도를 ' + man(tot - cb.lim) + '원 넘어요. 넘는 금액은 증여세 대상이에요.';

  var left = Math.max(0, cb.lim - used);
  document.getElementById('stLeft').textContent = man(left);
  var nb = BUCKETS[ci + 1];
  document.getElementById('stNext').textContent = nb ? nb.start.slice(0, 7).replace('-', '.') : '–';
  var need = data.filter(function (r) { return r.st === 'done' && r.rep === 'need'; }).length;
  var ne = document.getElementById('stNeed');
  ne.textContent = need + '건'; ne.style.color = need ? 'var(--accent)' : 'var(--fg2)';

  document.getElementById('buckets').innerHTML = BUCKETS.map(function (b, i) {
    var s = sums(i);
    return '<div class="bk' + (i === ci ? ' cur' : '') + '"><span class="lbl">' + b.name + '</span><b>' + man(s.done) + '</b><span class="lbl">/ ' + man(b.lim) + '</span>' +
      '<div class="mini"><i style="width:' + Math.min(s.done / b.lim, 1) * 100 + '%;background:var(--mint)"></i><i style="width:' + Math.min(s.plan / b.lim, 1) * 100 + '%;background:rgba(61,214,176,.35)"></i></div></div>';
  }).join('');

  var rows = data.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
  document.getElementById('logCnt').textContent = rows.length + '건';
  var el = document.getElementById('list');
  if (!rows.length) {
    el.innerHTML = '<div class="empty">아직 증여 기록이 없어요<br>＋ 추가로 첫 증여나 계획을 넣어보세요</div>';
    return;
  }
  el.innerHTML = rows.map(function (r) {
    var pills = '';
    if (r.st === 'plan') pills = '<span class="pill plan">계획</span>';
    else {
      pills = '<button class="pill ' + (r.rep === 'done' ? 'ok' : 'need') + '" data-rep="' + r.id + '">' + (r.rep === 'done' ? '신고 완료' : '신고 필요') + '</button>';
      if (r.rep !== 'done') { var d = dday(deadline(r.date)); pills += '<span class="dd">' + (d >= 0 ? '마감 D-' + d : '마감 ' + (-d) + '일 지남') + '</span>'; }
    }
    pills = '<span class="pill kind">' + esc(r.kind) + '</span>' + pills;
    return '<div class="row' + (r.st === 'plan' ? ' plan' : '') + '" data-id="' + r.id + '">' +
      '<span class="d">' + dot(r.date) + '<small>만 ' + Math.max(0, ageAt(r.date)) + '세</small></span>' +
      '<div class="m"><span class="t">' + esc(r.giver) + (r.memo ? ' · ' + esc(r.memo) : '') + '</span><span class="pills">' + pills + '</span></div>' +
      '<span class="a">' + man(r.amt) + '</span></div>';
  }).join('');
}

document.getElementById('list').addEventListener('click', function (e) {
  var p = e.target.closest('[data-rep]');
  if (p) {
    var r = data.find(function (x) { return x.id === p.dataset.rep; });
    r.rep = r.rep === 'done' ? 'need' : 'done';
    save(); render(); return;
  }
  var row = e.target.closest('.row');
  if (row) openSheet(row.dataset.id);
});

/* ── 입력 시트 ── */
var editId = null, f = {}, delArmed = false;
function opts(id, list, key) {
  var el = document.getElementById(id);
  el.innerHTML = list.map(function (v) { return '<button type="button" data-v="' + v + '">' + v + '</button>'; }).join('');
  el.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { f[key] = b.dataset.v; paint(); } });
}
opts('fGiver', GIVERS, 'giver');
opts('fKind', KINDS, 'kind');
['fSt', 'fRep'].forEach(function (id) {
  document.getElementById(id).addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    f[id === 'fSt' ? 'st' : 'rep'] = b.dataset.v; paint();
  });
});
document.getElementById('fAmt').addEventListener('input', function () {
  var v = this.value.replace(/[^0-9]/g, ''); this.value = v ? Number(v).toLocaleString('ko-KR') : '';
});
document.getElementById('fDate').addEventListener('change', paint);
function paint() {
  [['fGiver', 'giver'], ['fKind', 'kind'], ['fSt', 'st'], ['fRep', 'rep']].forEach(function (p) {
    document.querySelectorAll('#' + p[0] + ' button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === f[p[1]]); });
  });
  document.getElementById('fRepWrap').hidden = f.st !== 'done';
  var d = document.getElementById('fDate').value;
  document.getElementById('fRepHint').textContent = d ? '신고 기한: ' + dot(deadline(d)) + ' (증여한 달 말일부터 3개월)' : '';
}
function openSheet(id) {
  editId = id || null; delArmed = false;
  var r = id ? data.find(function (x) { return x.id === id; }) : null;
  document.getElementById('sheetTitle').textContent = r ? '증여 수정' : '새 증여';
  document.getElementById('fDate').value = r ? r.date : today();
  document.getElementById('fAmt').value = r ? Math.round(r.amt / MAN).toLocaleString('ko-KR') : '';
  document.getElementById('fMemo').value = r ? r.memo || '' : '';
  f = { st: r ? r.st : 'done', giver: r ? r.giver : '아빠', kind: r ? r.kind : '현금', rep: r ? r.rep || 'need' : 'need' };
  var del = document.getElementById('fDel'); del.hidden = !r; del.textContent = '삭제';
  document.getElementById('fErr').textContent = '';
  paint();
  document.getElementById('dim').hidden = false;
  document.getElementById('sheet').hidden = false;
}
function closeSheet() { document.getElementById('dim').hidden = true; document.getElementById('sheet').hidden = true; }
document.getElementById('fSave').onclick = function () {
  var date = document.getElementById('fDate').value;
  var amt = Number(document.getElementById('fAmt').value.replace(/[^0-9]/g, '')) * MAN;
  if (!date) { document.getElementById('fErr').textContent = '날짜를 넣어 주세요'; return; }
  if (!amt) { document.getElementById('fErr').textContent = '금액을 만원 단위로 넣어 주세요'; return; }
  var rec = { date: date, amt: amt, giver: f.giver, kind: f.kind, memo: document.getElementById('fMemo').value.trim(), st: f.st, rep: f.st === 'done' ? f.rep : 'need' };
  if (editId) Object.assign(data.find(function (x) { return x.id === editId; }), rec);
  else { rec.id = Date.now().toString(36); data.push(rec); }
  save(); closeSheet(); render();
};
document.getElementById('fDel').onclick = function () {
  if (!delArmed) { delArmed = true; this.textContent = '한 번 더 눌러 삭제'; return; }
  data = data.filter(function (x) { return x.id !== editId; });
  save(); closeSheet(); render();
};

render();

function toggleVersionPopup(e) {
  e.stopPropagation();
  var p = document.getElementById('versionPopup');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
}
document.addEventListener('click', function () { var p = document.getElementById('versionPopup'); if (p) p.style.display = 'none'; });
</script>
<script src="version.js" data-page="gift"></script>
