const CATEGORY_LABEL = { '부': '부', '모': '모', '형': '형', '수': '수홍' };
const CATEGORY_CLASS = { '부': 'cat-bu', '모': 'cat-mo', '형': 'cat-hyung', '수': 'cat-su' };

let query = '';
let filter = 'all';

function formatAmount(n) { return n.toLocaleString('ko-KR') + '원'; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function renderRows(rows) {
  return rows.map(function(r, i) {
    var rowClass = i % 2 === 0 ? 'row-white' : 'row-stripe';
    var catClass = CATEGORY_CLASS[r.cat] || '';
    var catLabel = CATEGORY_LABEL[r.cat] || r.cat;
    var note = r.note ? escapeHtml(r.note) : '-';
    return '<tr class="' + rowClass + '">' +
      '<td class="td-no">' + r.n + '</td>' +
      '<td class="td-name">' + escapeHtml(r.name) + '</td>' +
      '<td class="td-cat ' + catClass + '">' + catLabel + '</td>' +
      '<td class="td-method">' + r.method + '</td>' +
      '<td class="td-amt">' + formatAmount(r.amt) + '</td>' +
      '<td class="td-note">' + note + '</td>' +
    '</tr>';
  }).join('');
}

function render() {
  var q = query.trim();
  var filtered = DATA.filter(function(r) {
    if (q && r.name.indexOf(q) === -1) return false;
    if (filter === 'all') return true;
    var parts = filter.split(':');
    var type = parts[0], val = parts[1];
    if (type === 'method') return r.method === val;
    if (type === 'category') return r.cat === val;
    return true;
  });

  var onsite = filtered.filter(function(r) { return r.method === '현장'; });
  var transfer = filtered.filter(function(r) { return r.method === '입금'; });

  document.getElementById('countNum').textContent = filtered.length;

  var onsiteSection = document.getElementById('onsiteSection');
  if (onsite.length === 0) {
    onsiteSection.style.display = 'none';
  } else {
    onsiteSection.style.display = 'block';
    document.getElementById('onsiteCount').textContent = onsite.length + '명';
    document.getElementById('onsiteBody').innerHTML = renderRows(onsite);
  }

  var transferSection = document.getElementById('transferSection');
  if (transfer.length === 0) {
    transferSection.style.display = 'none';
  } else {
    transferSection.style.display = 'block';
    document.getElementById('transferCount').textContent = transfer.length + '명';
    document.getElementById('transferBody').innerHTML = renderRows(transfer);
  }

  document.getElementById('emptyState').style.display = filtered.length === 0 ? 'flex' : 'none';
}

var searchInput = document.getElementById('searchInput');
var clearBtn = document.getElementById('clearBtn');

searchInput.addEventListener('input', function(e) {
  query = e.target.value;
  clearBtn.style.display = query ? 'block' : 'none';
  render();
});

clearBtn.addEventListener('click', function() {
  query = '';
  searchInput.value = '';
  clearBtn.style.display = 'none';
  render();
});

document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    filter = btn.getAttribute('data-filter');
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    render();
  });
});

render();
