const CATEGORY_LABEL = { '부': '부', '모': '모', '형': '형', '수': '수홍' };
const CATEGORY_CLASS = { '부': 'cat-bu', '모': 'cat-mo', '형': 'cat-hyung', '수': 'cat-su' };

let query = '';
let filter = 'all';
let sortMode = 'none'; // 'none' | 'asc' | 'desc'

// Load persisted DATA from localStorage if available
const WEDDING_KEY = 'wedding-ledger-v1';
(function() {
  try {
    var saved = localStorage.getItem(WEDDING_KEY);
    if (saved) {
      var parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) {
        DATA.length = 0;
        parsed.forEach(function(r) { DATA.push(r); });
      }
    }
  } catch(e) {}
})();

function saveData() {
  try { localStorage.setItem(WEDDING_KEY, JSON.stringify(DATA)); } catch(e) {}
}

function fmt(n) { return n.toLocaleString('ko-KR') + '원'; }
function fmtM(n) { return (n / 10000).toLocaleString('ko-KR') + '만원'; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function renderRows(rows) {
  return rows.map(function(r, i) {
    var rowClass = i % 2 === 0 ? 'row-white' : 'row-stripe';
    var catClass = CATEGORY_CLASS[r.cat] || '';
    var catLabel = CATEGORY_LABEL[r.cat] || r.cat;
    // data-n used as key to find original item
    return '<tr class="' + rowClass + '">' +
      '<td class="td-no">' + r.n + '</td>' +
      '<td class="td-name">' + escapeHtml(r.name) + '</td>' +
      '<td class="td-cat ' + catClass + '">' + catLabel + '</td>' +
      '<td class="td-method">' + r.method + '</td>' +
      '<td class="td-amt">' + fmt(r.amt) + '</td>' +
      '<td class="td-note"><input class="note-input" data-n="' + r.n + '" value="' + escapeHtml(r.note || '') + '" placeholder="-" maxlength="40"></td>' +
    '</tr>';
  }).join('');
}

function attachNoteListeners(tbodyEl) {
  tbodyEl.querySelectorAll('.note-input').forEach(function(input) {
    input.addEventListener('change', function() {
      var n = parseInt(input.getAttribute('data-n'), 10);
      var item = DATA.find(function(r) { return r.n === n; });
      if (item) {
        item.note = input.value;
        saveData();
      }
    });
  });
}

function render() {
  var q = query.trim();
  var filtered = DATA.filter(function(r) {
    if (q && r.name.indexOf(q) === -1) return false;
    if (filter === 'all') return true;
    var parts = filter.split(':');
    var type = parts[0], val = parts[1];
    if (type === 'method') return r.method === val;
    if (type === 'category') return r.cat === val;
    return true;
  });

  // Apply sort
  if (sortMode === 'asc') {
    filtered = filtered.slice().sort(function(a, b) { return a.amt - b.amt; });
  } else if (sortMode === 'desc') {
    filtered = filtered.slice().sort(function(a, b) { return b.amt - a.amt; });
  }

  var onsite = filtered.filter(function(r) { return r.method === '현장'; });
  var transfer = filtered.filter(function(r) { return r.method === '입금'; });

  var total = filtered.reduce(function(s, r) { return s + r.amt; }, 0);
  var totalAll = DATA.reduce(function(s, r) { return s + r.amt; }, 0);

  document.getElementById('countNum').textContent = filtered.length;

  // Update header total
  document.getElementById('totalDisplay').innerHTML =
    '<span style="font-size:10px;color:var(--fg3);letter-spacing:.07em;text-transform:uppercase;display:block;">TOTAL</span>' +
    '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:16px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;">' + fmtM(filter === 'all' && !q ? totalAll : total) + '</span>';

  // Stats row
  var cats = ['부','모','형','수'];
  var catColors = {'부':'var(--blue)','모':'var(--pink)','형':'var(--green)','수':'var(--amber)'};
  var catTotals = {};
  cats.forEach(function(c) {
    catTotals[c] = DATA.filter(function(r) { return r.cat === c; }).reduce(function(s,r) { return s+r.amt; },0);
  });
  document.getElementById('statsRow').innerHTML = cats.map(function(c) {
    return '<div class="bb-stat-chip">' +
      '<div class="bb-stat-label" style="color:' + catColors[c] + ';">' + (CATEGORY_LABEL[c]||c) + '</div>' +
      '<div class="bb-stat-value" style="color:' + catColors[c] + ';">' + fmtM(catTotals[c]) + '</div>' +
    '</div>';
  }).join('');

  var onsiteSection = document.getElementById('onsiteSection');
  if (onsite.length === 0) {
    onsiteSection.style.display = 'none';
  } else {
    onsiteSection.style.display = 'block';
    document.getElementById('onsiteCount').textContent = onsite.length + '명 · ' + fmtM(onsite.reduce(function(s,r){return s+r.amt;},0));
    var onsiteBody = document.getElementById('onsiteBody');
    onsiteBody.innerHTML = renderRows(onsite);
    attachNoteListeners(onsiteBody);
  }

  var transferSection = document.getElementById('transferSection');
  if (transfer.length === 0) {
    transferSection.style.display = 'none';
  } else {
    transferSection.style.display = 'block';
    document.getElementById('transferCount').textContent = transfer.length + '명 · ' + fmtM(transfer.reduce(function(s,r){return s+r.amt;},0));
    var transferBody = document.getElementById('transferBody');
    transferBody.innerHTML = renderRows(transfer);
    attachNoteListeners(transferBody);
  }

  document.getElementById('emptyState').style.display = filtered.length === 0 ? 'flex' : 'none';
}

var searchInput = document.getElementById('searchInput');
var clearBtn = document.getElementById('clearBtn');

searchInput.addEventListener('input', function(e) {
  query = e.target.value;
  clearBtn.style.display = query ? 'block' : 'none';
  render();
});

clearBtn.addEventListener('click', function() {
  query = '';
  searchInput.value = '';
  clearBtn.style.display = 'none';
  render();
});

document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    filter = btn.getAttribute('data-filter');
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    render();
  });
});

document.querySelectorAll('.sort-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    sortMode = btn.getAttribute('data-sort');
    document.querySelectorAll('.sort-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    render();
  });
});

// Add row form functions
function openAddForm() {
  document.getElementById('af-name').value = '';
  document.getElementById('af-cat').value = '수';
  document.getElementById('af-method').value = '현장';
  document.getElementById('af-amt').value = '';
  document.getElementById('af-note').value = '';
  document.getElementById('addFormOverlay').classList.add('open');
  setTimeout(function() { document.getElementById('af-name').focus(); }, 50);
}
function closeAddForm() {
  document.getElementById('addFormOverlay').classList.remove('open');
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('addFormOverlay')) closeAddForm();
}
function submitAddForm() {
  var name = document.getElementById('af-name').value.trim();
  if (!name) { document.getElementById('af-name').focus(); return; }
  var amtRaw = parseInt(document.getElementById('af-amt').value, 10);
  if (isNaN(amtRaw) || amtRaw < 0) { document.getElementById('af-amt').focus(); return; }
  var maxN = DATA.reduce(function(m, r) { return Math.max(m, r.n); }, 0);
  DATA.push({
    n: maxN + 1,
    name: name,
    cat: document.getElementById('af-cat').value,
    method: document.getElementById('af-method').value,
    amt: amtRaw,
    note: document.getElementById('af-note').value.trim()
  });
  saveData();
  closeAddForm();
  render();
}

render();

function toggleVersionPopup(e) {
  e.stopPropagation();
  var p = document.getElementById('versionPopup');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', function() {
  var p = document.getElementById('versionPopup');
  if (p) p.style.display = 'none';
});
